[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=tests/unit/test_core_simple.py
    --deselect=tests/unit/test_providers.py::TestGeminiProvider::test_is_available_without_key
    --deselect=tests/unit/test_providers_simple.py::TestGeminiProvider::test_is_available_without_key
    --deselect=tests/unit/shared/test_config.py::TestConfig::test_get_with_source
    --deselect=tests/unit/shared/test_config.py::TestConfig::test_save_to_file
    --deselect=tests/unit/shared/test_config.py::TestConfig::test_save_to_file_no_path
    --deselect=tests/unit/shared/test_retry.py::TestWithRetryDecorator::test_non_retryable_exception
    --deselect=tests/unit/shared/test_retry.py::TestRetryContext::test_context_retries
    --deselect=tests/unit/test_ranking.py::TestDeduplicator::test_get_duplicate_groups
    --deselect=tests/unit/test_research_python.py::TestWithRetry::test_retry_eventual_success
    --deselect=tests/unit/test_research_python.py::TestWithRetry::test_retry_exhausted
markers =
    unit: Unit tests
    integration: Integration tests requiring external services
    slow: Tests taking >5 seconds
    asyncio: Async tests
asyncio_mode = auto
