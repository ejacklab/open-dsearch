[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=tests/unit/test_core_simple.py
markers =
    unit: Unit tests
    integration: Integration tests requiring external services
    slow: Tests taking >5 seconds
    asyncio: Async tests
asyncio_mode = auto
