services:
  db:
    image: postgres:16-alpine
    container_name: pulse-db
    environment:
      POSTGRES_USER: pulse_admin
      POSTGRES_PASSWORD: pulse_secure_password
      POSTGRES_DB: pulse_vault
    ports:
      - "5432:5432"
    volumes:
      - ./docs/architecture/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./docs/architecture/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_admin -d pulse_vault"]
      interval: 5s
      timeout: 5s
      retries: 5
