name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests
        run: pytest tests/unit -v --cov=scripts --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  rust-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Run Rust tests
        run: |
          cd scripts/rust
          cargo test
          cargo test --release
      
      - name: Build release binary
        run: |
          cd scripts/rust
          cargo build --release
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: scripts/rust/target/release/research

  integration-tests:
    runs-on: ubuntu-latest
    needs: [python-tests, rust-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download Rust binary
        uses: actions/download-artifact@v4
        with:
          name: rust-binary
          path: scripts/rust/target/release/
      
      - name: Make binary executable
        run: chmod +x scripts/rust/target/release/research
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-dev.txt
      
      - name: Run integration tests
        run: pytest tests/integration -v -m "not live_api"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install bandit safety
      
      - name: Run drift_scan
        run: python scripts/drift_scan.py
      
      - name: Run bandit
        run: bandit -r scripts/ -f json -o bandit-report.json || true
      
      - name: Run safety check
        run: safety check || true
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install black ruff mypy
      
      - name: Check code formatting with black
        run: black --check scripts/ tests/
      
      - name: Lint with ruff
        run: ruff check scripts/ tests/
      
      - name: Type check with mypy
        run: mypy scripts/ --ignore-missing-imports || true
