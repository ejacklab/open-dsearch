[package]
name = "dsearch"
version = "0.1.0"
edition = "2021"

[lib]
name = "dsearch"
path = "src/lib.rs"

[[bin]]
name = "web_search"
path = "src/web_search.rs"

[[bin]]
name = "web_fetch"
path = "src/web_fetch.rs"

[[bin]]
name = "synthesize"
path = "src/synthesize.rs"

[[bin]]
name = "research"
path = "src/research.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
scraper = "0.22"
html2md = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
urlencoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
chrono = "0.4"

[[example]]
name = "benchmark_gemini"
path = "examples/benchmark_gemini.rs"
