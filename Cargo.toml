[package]
name = "open-dsearch"
version = "0.1.0"
edition = "2021"
description = "A cutting-edge research platform for AI agents, protocols, and deep research methodologies"
authors = ["ejacklab <team@ejacklab.com>"]
license = "MIT"
repository = "https://github.com/ejacklab/open-dsearch"
keywords = ["ai", "research", "search", "vector-database", "multi-model"]
categories = ["science", "database", "web-programming"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Text processing
regex = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Vector database
zvec = { version = "0.7", optional = true }

# Configuration
config = "0.13"
toml = "0.8"

# AI model integrations
# These will be optional features to reduce dependencies
async-openai = { version = "0.18", optional = true }
google-gemini-api = { version = "0.1", optional = true }
minimax-api = { version = "0.1", optional = true }

# Search and parsing
select = "0.6"
scraper = { version = "0.18", optional = true }
html2text = { version = "0.6", optional = true }

# CLI
dialoguer = "0.11"
indicatif = "0.17"

[features]
default = ["gemini", "xai", "minimax", "web-scraper"]
gemini = ["google-gemini-api"]
xai = ["async-openai"]
minimax = ["minimax-api"]
web-scraper = ["scraper", "html2text"]
vector-db = ["zvec"]

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"

[[bin]]
name = "dsearch"
path = "src/main.rs"

[lib]
name = "dsearch"
path = "src/lib.rs"