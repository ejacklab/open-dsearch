[package]
name = "open-dsearch"
version = "0.2.0"
edition = "2021"
description = "A cutting-edge research platform for AI agents, protocols, and deep research methodologies"
authors = ["ejacklab <team@ejacklab.com>"]
license = "MIT"
repository = "https://github.com/ejacklab/open-dsearch"
keywords = ["ai", "research", "search", "vector-database", "multi-model"]
categories = ["science", "database", "web-programming"]

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# Text processing
regex = "1"

# HTTP client (uses rustls — no system OpenSSL needed)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Config
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

# CLI UX
dialoguer = "0.11"
indicatif = "0.17"
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "dsearch"
path = "src/main.rs"

[lib]
name = "dsearch"
path = "src/lib.rs"
